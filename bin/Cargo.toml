[package]
name = "bin"
version = "0.1.0"
edition = "2024"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[dependencies]
serde_json = { version = "1.0.141", features = ["preserve_order"] }
anyhow = "1.0.98"
ignore = "0.4.23"
log = "0.4.27"
env_logger = "0.11.8"
serde_yaml = "0.9.34"

[dependencies.serde]
version = "1.0.219"
features = ["derive"]

[dependencies.jsonc-parser]
version = "0.26"
features = ["serde"]

[build-dependencies]
serde_json = "1.0.141"
